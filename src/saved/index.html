<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved missions | Space Mission Explorer</title>
    <meta
      name="description"
      content="The space missions you saved, kept in your browser so you can return to them later."
    />
    <link rel="icon" href="../images/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/saved.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" tabindex="-1">
      <h1 id="page-title" tabindex="-1">Saved missions</h1>
      <section aria-labelledby="list-title">
        <h2 id="list-title" class="sr-only">Your saved missions</h2>
        <div id="saved-list" class="grid"></div>
      </section>
      <p id="live" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
