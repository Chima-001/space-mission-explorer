<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Mission Explorer | Launches, missions and NASA images</title>
    <meta
      name="description"
      content="Browse upcoming and past space launches, read mission details, see NASA images and save the missions you follow."
    />
    <link rel="icon" href="./images/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" tabindex="-1">
      <section id="hero" class="hero" aria-labelledby="hero-title">
        <div class="hero-copy"></div>
      </section>

      <section id="featured-section" aria-label="Featured NASA image">
        <h2 class="section-title">Today's NASA image</h2>
        <div id="featured"></div>
      </section>

      <section aria-labelledby="next-title">
        <h2 id="next-title" class="section-title">Next launches</h2>
        <div id="notice"></div>
        <div id="mission-list" class="grid"></div>
        <p class="center">
          <a id="all-link" class="btn btn-ghost" href="#">View all upcoming</a>
        </p>
      </section>
      <p id="live" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
